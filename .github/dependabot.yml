version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # oxlint 1.80 removes the configured react/react-compiler rule. Upgrade only
      # when an equivalent compiler-safety check is part of the same change.
      - dependency-name: oxlint
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
